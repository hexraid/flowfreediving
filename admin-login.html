<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FLOW FREEDIVING Admin Login</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #f9fafb;
      color: #111827;
    }
    .login-card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: var(--radius-xl);
      padding: var(--space-12);
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
    }
    .login-card__logo {
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: var(--fw-extrabold);
      letter-spacing: var(--ls-wider);
      color: #111827;
      text-transform: uppercase;
      margin-bottom: var(--space-2);
    }
    .login-card__logo span { font-weight: var(--fw-light); color: #6b7280; }
    .login-card__label {
      font-size: var(--fs-caption);
      color: #4b5563;
      margin-bottom: var(--space-8);
    }
    .login-input {
      width: 100%;
      padding: 14px 18px;
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: var(--radius-md);
      color: #111827;
      font-size: var(--fs-body-sm);
      margin-bottom: var(--space-4);
      transition: border-color 0.2s;
    }
    .login-input:focus { border-color: #111827; outline: none; }
    .login-input::placeholder { color: #9ca3af; }
    .login-btn {
      width: 100%;
      padding: 14px;
      background: #111827;
      color: #ffffff;
      border: none;
      border-radius: var(--radius-md);
      font-size: var(--fs-body-sm);
      font-weight: var(--fw-semibold);
      cursor: pointer;
      transition: background 0.2s;
      margin-top: var(--space-2);
    }
    .login-btn:hover { background: #1f2937; }
    .login-btn:disabled { background: #9ca3af; cursor: not-allowed; }
    .login-error {
      color: #ef4444;
      font-size: var(--fs-small);
      margin-top: var(--space-3);
      display: none;
      text-align: center;
    }
    .login-links {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      margin-top: var(--space-4);
      font-size: var(--fs-caption);
      color: #6b7280;
    }
    .login-link-btn {
      background: none;
      border: none;
      padding: 0;
      color: #6b7280;
      font-size: var(--fs-caption);
      cursor: pointer;
      transition: color 0.2s;
    }
    .login-link-btn:hover {
      color: #111827;
      text-decoration: underline;
    }
    .login-link-divider {
      color: #d1d5db;
      font-size: 11px;
    }
    .sub-form__desc {
      font-size: var(--fs-caption);
      color: #4b5563;
      margin-bottom: var(--space-4);
      line-height: 1.5;
      word-break: keep-all;
    }
    .login-result {
      margin-top: var(--space-3);
      padding: 12px 14px;
      border-radius: var(--radius-md);
      font-size: var(--fs-small);
      line-height: 1.5;
      text-align: center;
      word-break: keep-all;
    }
    .login-result--success {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #166534;
    }
    .login-result--error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
    }
    .back-link-btn {
      display: inline-block;
      margin-top: var(--space-5);
      background: none;
      border: none;
      padding: 0;
      font-size: var(--fs-caption);
      color: #6b7280;
      cursor: pointer;
      transition: color 0.2s;
    }
    .back-link-btn:hover { color: #111827; }
    .login-back {
      display: inline-block;
      margin-top: var(--space-6);
      font-size: var(--fs-caption);
      color: #6b7280;
      transition: color 0.2s;
    }
    .login-back:hover { color: #111827; }
  </style>
</head>
<body>
  <div class="login-card">
    <p class="login-card__logo">FLOW <span>FREEDIVING</span></p>
    <p class="login-card__label" id="cardTitle">관리자 로그인</p>

    <!-- 1. 로그인 폼 -->
    <div id="loginSection">
      <form id="loginForm" autocomplete="off">
        <!-- 브라우저 자동완성 가두기 트랩 (Dummy Fields) -->
        <input type="text" name="fake_username_trap" style="display:none !important; position:absolute !important; left:-9999px !important;" tabindex="-1" aria-hidden="true" value="" autocomplete="off">
        <input type="password" name="fake_password_trap" style="display:none !important; position:absolute !important; left:-9999px !important;" tabindex="-1" aria-hidden="true" value="" autocomplete="new-password">

        <input type="text" class="login-input" id="loginId" placeholder="아이디" value="" autocomplete="off" readonly onfocus="this.removeAttribute('readonly');" onclick="this.removeAttribute('readonly');" required>
        <input type="password" class="login-input" id="loginPw" placeholder="비밀번호" value="" autocomplete="new-password" readonly onfocus="this.removeAttribute('readonly');" onclick="this.removeAttribute('readonly');" required>
        <button type="submit" class="login-btn" id="loginBtn">로그인</button>
        <p class="login-error" id="loginError"></p>
      </form>
      <div class="login-links">
        <button type="button" class="login-link-btn" id="showFindIdBtn">아이디 찾기</button>
        <span class="login-link-divider">|</span>
        <button type="button" class="login-link-btn" id="showFindPwBtn">비밀번호 찾기</button>
      </div>
    </div>

    <!-- 2. 아이디 찾기 폼 -->
    <div id="findIdSection" style="display: none;">
      <p class="sub-form__desc">등록된 이메일 주소를 입력하시면 연결된 관리자 아이디를 확인하실 수 있습니다.</p>
      <form id="findIdForm" autocomplete="off">
        <input type="email" class="login-input" id="findIdEmail" placeholder="등록 이메일" value="" autocomplete="off" required>
        <button type="submit" class="login-btn" id="findIdBtn">아이디 찾기</button>
      </form>
      <div class="login-result" id="findIdResult" style="display: none;"></div>
      <button type="button" class="back-link-btn" id="backToLoginFromId">← 로그인으로 돌아가기</button>
    </div>

    <!-- 3. 비밀번호 찾기 폼 -->
    <div id="findPwSection" style="display: none;">
      <p class="sub-form__desc">관리자 아이디 또는 등록 이메일을 입력하시면 비밀번호 재설정 링크를 발송해 드립니다.</p>
      <form id="findPwForm" autocomplete="off">
        <input type="text" class="login-input" id="findPwInput" placeholder="관리자 아이디 또는 등록 이메일" value="" autocomplete="off" required>
        <button type="submit" class="login-btn" id="findPwBtn">재설정 링크 전송</button>
      </form>
      <div class="login-result" id="findPwResult" style="display: none;"></div>
      <button type="button" class="back-link-btn" id="backToLoginFromPw">← 로그인으로 돌아가기</button>
    </div>

    <a href="index.html" class="login-back">← 사이트로 돌아가기</a>
  </div>

  <script type="module">
    import { 
      loginWithAdminId, 
      findAdminIdByEmail, 
      sendAdminPasswordReset, 
      onAdminAuthStateChanged 
    } from './js/firebase-service.js';

    // DOM Elements
    const cardTitle = document.getElementById('cardTitle');
    
    const loginSection = document.getElementById('loginSection');
    const loginForm = document.getElementById('loginForm');
    const idInput = document.getElementById('loginId');
    const pwInput = document.getElementById('loginPw');
    const loginBtn = document.getElementById('loginBtn');
    const loginError = document.getElementById('loginError');
    const showFindIdBtn = document.getElementById('showFindIdBtn');
    const showFindPwBtn = document.getElementById('showFindPwBtn');

    const findIdSection = document.getElementById('findIdSection');
    const findIdForm = document.getElementById('findIdForm');
    const findIdEmailInput = document.getElementById('findIdEmail');
    const findIdBtn = document.getElementById('findIdBtn');
    const findIdResult = document.getElementById('findIdResult');
    const backToLoginFromId = document.getElementById('backToLoginFromId');

    const findPwSection = document.getElementById('findPwSection');
    const findPwForm = document.getElementById('findPwForm');
    const findPwInput = document.getElementById('findPwInput');
    const findPwBtn = document.getElementById('findPwBtn');
    const findPwResult = document.getElementById('findPwResult');
    const backToLoginFromPw = document.getElementById('backToLoginFromPw');

    // F5 새로고침 및 캐시 복원 시 브라우저 자동채우기 완전 차단 로직
    function clearLoginFields() {
      if (loginForm) loginForm.reset();
      if (findIdForm) findIdForm.reset();
      if (findPwForm) findPwForm.reset();

      if (idInput) {
        idInput.value = '';
        idInput.setAttribute('readonly', 'readonly');
      }
      if (pwInput) {
        pwInput.value = '';
        pwInput.setAttribute('readonly', 'readonly');
      }
      if (findIdEmailInput) findIdEmailInput.value = '';
      if (findPwInput) findPwInput.value = '';
    }

    // 클릭/포커스 시 readonly 즉시 해제
    [idInput, pwInput].forEach((el) => {
      if (el) {
        const unlock = () => el.removeAttribute('readonly');
        el.addEventListener('focus', unlock);
        el.addEventListener('click', unlock);
        el.addEventListener('keydown', unlock);
      }
    });

    clearLoginFields();
    window.addEventListener('pageshow', clearLoginFields);
    window.addEventListener('DOMContentLoaded', clearLoginFields);
    setTimeout(clearLoginFields, 100);
    setTimeout(clearLoginFields, 300);

    // 이미 로그인된 상태인 경우 관리자 페이지로 자동 이동
    onAdminAuthStateChanged((user) => {
      if (user) {
        sessionStorage.setItem('flow_admin_auth', 'true');
        window.location.replace('admin.html');
      }
    });

    // 화면 전환 함수
    function switchView(targetView) {
      loginError.style.display = 'none';
      loginError.textContent = '';

      findIdResult.style.display = 'none';
      findIdResult.textContent = '';
      findIdResult.className = 'login-result';

      findPwResult.style.display = 'none';
      findPwResult.textContent = '';
      findPwResult.className = 'login-result';

      loginSection.style.display = 'none';
      findIdSection.style.display = 'none';
      findPwSection.style.display = 'none';

      if (targetView === 'findId') {
        cardTitle.textContent = '아이디 찾기';
        findIdSection.style.display = 'block';
        findIdEmailInput.focus();
      } else if (targetView === 'findPw') {
        cardTitle.textContent = '비밀번호 찾기';
        findPwSection.style.display = 'block';
        findPwInput.focus();
      } else {
        cardTitle.textContent = '관리자 로그인';
        loginSection.style.display = 'block';
        idInput.focus();
      }
    }

    showFindIdBtn.addEventListener('click', () => switchView('findId'));
    showFindPwBtn.addEventListener('click', () => switchView('findPw'));
    backToLoginFromId.addEventListener('click', () => switchView('login'));
    backToLoginFromPw.addEventListener('click', () => switchView('login'));

    // 1. 로그인 폼 제출
    loginForm.addEventListener('submit', async function(e) {
      e.preventDefault();
      loginError.style.display = 'none';
      loginError.textContent = '';

      const idVal = idInput.value.trim();
      const pwVal = pwInput.value;

      if (!idVal || !pwVal) {
        loginError.textContent = '아이디와 비밀번호를 모두 입력해주세요.';
        loginError.style.display = 'block';
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = '로그인 중...';

      try {
        await loginWithAdminId(idVal, pwVal);
        sessionStorage.setItem('flow_admin_auth', 'true');
        window.location.href = 'admin.html';
      } catch (err) {
        console.warn('Firebase Login Error:', err.code, err.message);
        let msg = '아이디 또는 비밀번호를 확인해주세요.';

        if (
          err.code === 'auth/user-not-found' || 
          err.code === 'auth/wrong-password' || 
          err.code === 'auth/invalid-credential' ||
          err.code === 'auth/invalid-email'
        ) {
          msg = '아이디 또는 비밀번호를 확인해주세요.';
        } else if (err.code === 'auth/too-many-requests') {
          msg = '로그인 시도가 너무 많습니다. 잠시 후 다시 시도해주세요.';
        } else if (err.code === 'auth/network-request-failed') {
          msg = '네트워크 연결 상태를 확인해주세요.';
        } else if (err.code === 'auth/user-disabled') {
          msg = '비활성화된 계정입니다. 관리자에게 문의해주세요.';
        } else if (err.message && err.message.includes('초기화되지 않았습니다')) {
          msg = err.message;
        }

        loginError.textContent = msg;
        loginError.style.display = 'block';
        loginBtn.disabled = false;
        loginBtn.textContent = '로그인';
      }
    });

    // 2. 아이디 찾기 폼 제출
    findIdForm.addEventListener('submit', async function(e) {
      e.preventDefault();
      findIdResult.style.display = 'none';

      const emailVal = findIdEmailInput.value.trim();
      if (!emailVal) return;

      findIdBtn.disabled = true;
      findIdBtn.textContent = '조회 중...';

      try {
        const result = await findAdminIdByEmail(emailVal);
        findIdResult.style.display = 'block';
        if (result && result.maskedId) {
          findIdResult.className = 'login-result login-result--success';
          findIdResult.innerHTML = `등록된 관리자 아이디: <strong>${result.maskedId}</strong>`;
        } else {
          findIdResult.className = 'login-result login-result--error';
          findIdResult.textContent = '입력하신 이메일로 등록된 관리자 계정을 찾을 수 없습니다.';
        }
      } catch (err) {
        console.warn('Find ID Error:', err);
        findIdResult.style.display = 'block';
        findIdResult.className = 'login-result login-result--error';
        findIdResult.textContent = '아이디 조회 중 오류가 발생했습니다. 이메일을 다시 확인해주세요.';
      } finally {
        findIdBtn.disabled = false;
        findIdBtn.textContent = '아이디 찾기';
      }
    });

    // 3. 비밀번호 찾기 폼 제출
    findPwForm.addEventListener('submit', async function(e) {
      e.preventDefault();
      findPwResult.style.display = 'none';

      const inputVal = findPwInput.value.trim();
      if (!inputVal) return;

      findPwBtn.disabled = true;
      findPwBtn.textContent = '전송 중...';

      try {
        await sendAdminPasswordReset(inputVal);
        findPwResult.style.display = 'block';
        findPwResult.className = 'login-result login-result--success';
        findPwResult.textContent = '비밀번호 재설정 이메일을 보냈습니다. 이메일을 확인해주세요.';
      } catch (err) {
        console.warn('Find PW Error:', err);
        findPwResult.style.display = 'block';
        findPwResult.className = 'login-result login-result--error';
        let msg = '비밀번호 재설정 요청 중 오류가 발생했습니다. 입력 정보를 확인해주세요.';
        if (err.code === 'auth/user-not-found') {
          msg = '등록된 관리자 계정 정보를 찾을 수 없습니다.';
        }
        findPwResult.textContent = msg;
      } finally {
        findPwBtn.disabled = false;
        findPwBtn.textContent = '재설정 링크 전송';
      }
    });
  </script>
</body>
</html>
